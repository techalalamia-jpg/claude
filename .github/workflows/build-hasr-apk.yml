name: Build Hasr APK

on:
  push:
    branches: [main, master]
    paths:
      - "hasr-app/**"
      - ".github/workflows/build-hasr-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-hasr-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hasr-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Version code = run number (so a new build installs over the old one)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName|applicationId" android/app/build.gradle
      - name: Build debug APK
        working-directory: hasr-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasr-apk
          path: hasr-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          cp hasr-app/android/app/build/outputs/apk/debug/app-debug.apk hasr.apk
          gh release delete hasr-apk-latest --yes --cleanup-tag || true
          gh release create hasr-apk-latest hasr.apk \
            --title "حصر المستخلصات - APK" \
            --notes "نزّل hasr.apk وثبّته على الأندرويد (فعّل التثبيت من مصادر غير معروفة). نفس بيانات البرنامج على السحابة — سجّل دخولك بنفس الإيميل."
