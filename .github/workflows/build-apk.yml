name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "amazon-tracker/app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon-tracker/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Allow http:// server addresses (home network)
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: amazon-tracker/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-tracker-apk
          path: amazon-tracker/app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          cp amazon-tracker/app/android/app/build/outputs/apk/debug/app-debug.apk amazon-tracker.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest amazon-tracker.apk \
            --title "متتبع امازون - APK" \
            --notes "نزّل amazon-tracker.apk وثبّته على الأندرويد (فعّل التثبيت من مصادر غير معروفة)."
